<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daywork</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#14171f;--mute:#7b8190;--line:#ececf2;--pri:#3b5bfd;--pri-soft:#f1f3ff;--ok:#12803f;--ok-soft:#e8f7ee;--warn:#a85a00;--warn-soft:#fff5e5;--bad:#c2312b;--bad-soft:#fdeceb;--field:#fafbff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;font-size:15px;line-height:1.5}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:16px 14px 92px}
h1,h2,h3,p{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.logo{font-weight:700;font-size:22px;letter-spacing:.14em;color:var(--pri)}
.bal{font:inherit;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:13px;color:var(--mute)}
.hero{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 6px 24px rgba(30,40,90,.07);border-radius:24px;padding:22px 18px;margin-bottom:14px;text-align:center}
.hero .big{font-size:38px;font-weight:700;line-height:1.2}
.hero small{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);box-shadow:0 2px 10px rgba(30,40,90,.04);border-radius:18px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri);font-weight:500}
.tag{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:500}
.t-ok{background:var(--ok-soft);color:var(--ok)}.t-warn{background:var(--warn-soft);color:var(--warn)}.t-pri{background:var(--pri-soft);color:var(--pri)}.t-bad{background:var(--bad-soft);color:var(--bad)}
.btn{background:var(--pri);color:#fff;border:1px solid var(--pri);border-radius:999px;padding:8px 16px;font:inherit;font-weight:500;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--pri);border:1px solid var(--pri)}
.btn.sm{padding:4px 12px;font-size:13px}
.btn:focus-visible,.chip:focus-visible,.nav button:focus-visible,.cell:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.mute{color:var(--mute);font-size:13px}
.pay{font-weight:700;color:var(--ok)}
h2{font-size:17px;margin:6px 0 8px}
.job h3{font-size:16px}
.job .meta{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.sched{display:grid;grid-template-columns:44px repeat(4,1fr);gap:5px;font-size:12px;text-align:center}
.cell{border:0;border-radius:8px;padding:10px 0;font:inherit;font-size:12px;cursor:pointer;background:var(--ok-soft);color:var(--ok)}
.cell.busy{background:var(--pri-soft);color:var(--pri)}
.sched .h{color:var(--mute);align-self:center}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mute);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--pri);border-radius:6px 6px 0 0;min-height:3px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats .card{margin:0}
.stats b{font-size:20px;display:block}
.prog{height:10px;background:var(--pri-soft);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--ok)}
input,select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
form.add{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form.add .full{grid-column:1/-1}
.item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{display:flex;width:100%;max-width:480px}
.nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:12px;padding:10px 0 8px;cursor:pointer}
.nav button.on{color:var(--pri);font-weight:700}
.nav svg{display:block;margin:0 auto 2px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.why{background:var(--pri-soft);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:13px}.why ul{margin:4px 0 0;padding-left:18px;color:var(--mute)}.panel{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}:root[data-theme="dark"]{--bg:#0e1322;--card:#161c30;--ink:#eef1fb;--mute:#9aa3bd;--line:#273050;--ok:#4cd08a;--ok-soft:#12331f;--warn:#ffb55c;--warn-soft:#3a2a10;--bad:#ff8a84;--bad-soft:#3d1a19;--field:#1b2340}
.bal:focus-visible,.sw:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
:root[data-cb="1"]{--ok:#00588f;--ok-soft:#dbeeff;--bad:#a63d00;--bad-soft:#ffe9d9;--warn:#6b5500;--warn-soft:#fff3bf}
:root[data-theme="dark"][data-cb="1"]{--ok:#56b4e9;--ok-soft:#10304a;--bad:#ffa45c;--bad-soft:#4a2410;--warn:#f0e442;--warn-soft:#3d3a0c}
:root[data-cb="1"] .t-ok::before{content:"✓ "}:root[data-cb="1"] .t-bad::before{content:"✕ "}:root[data-cb="1"] .t-warn::before{content:"! "}
.themebtn{width:46px;height:46px;border-radius:50%;background:var(--pri);color:#fff;border:0;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(20,30,80,.28);position:relative;flex:none}
.themebtn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.themebtn.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--pri);animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.themebtn.pulse::after{animation:none}}
.hint{background:var(--pri-soft);border:1px solid var(--pri);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.steps{display:flex;gap:8px;margin:10px 0}.stp{flex:1;text-align:center;font-size:12px;color:var(--mute);border-top:4px solid var(--line);padding-top:6px}.stp span{display:block;font-size:16px;font-weight:700}.stp.done{border-color:var(--ok);color:var(--ok);font-weight:500}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="top"><span class="logo">Daywork</span><span class="row" style="gap:6px"><span class="bal" id="balTop" style="cursor:default"></span><button class="bal" data-lang="1" aria-label="Language" title="Language" style="display:flex;align-items:center;gap:4px;font-weight:700;padding:6px 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span id="langTxt">EN</span></button><button class="themebtn pulse" data-themeopen="1" aria-label="ปรับธีม ตาบอดสี และขนาดตัวอักษร" title="ปรับธีม"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-1 1.6-2.2-.4-1.2.3-2.3 1.6-2.3H17a4 4 0 0 0 4-4c0-5-4-9.5-9-9.5z"/><circle cx="7.5" cy="11" r="1" fill="currentColor"/><circle cx="10" cy="7" r="1" fill="currentColor"/><circle cx="15" cy="7.5" r="1" fill="currentColor"/></svg></button></span></div>
  <div id="themeSlot"></div>
  <main id="main"></main>
</div>
<div id="toast" role="status"></div>
<nav class="nav" aria-label="เมนูหลัก"><div id="nav"></div></nav>

<script>
const DAYS=['จ.','อ.','พ.','พฤ.','ศ.','ส.','อา.'];
const SLOTS=['เช้า','บ่าย','เย็น','ค่ำ'];
const SLOT_H=[4,4,4,3];
const ALL_SKILLS=['ตัดคลิป','ทำสไลด์','ออกแบบ','ถ่ายภาพ','เขียนบทความ','ติวหนังสือ','ช่วยงานกิจกรรม'];
const fmt=n=>Number(n).toLocaleString('th-TH');
const state={
  tab:'jobs',day:0,period:'week',
  skills:{'ตัดคลิป':2,'ทำสไลด์':2},hist:{},portfolio:[{s:'ตัดคลิป',t:'คลิปรีวิวคาเฟ่ 30 วินาที'}],hidden:new Set(),askill:'ทำสไลด์',method:'quiz',assessOpen:false,qans:{},evid:{},avoid:new Set(),rated:new Set(),open:null,
  busy:DAYS.map((_,d)=>SLOTS.map((_,s)=>d<5&&s<2)),
  reported:new Set(),applied:new Set(),
  goal:6000,
  income:[
    {d:0,t:'in',n:'ตัดคลิปรีวิวร้านกาแฟ',a:600,h:3},
    {d:1,t:'in',n:'ทำสไลด์ให้รุ่นพี่',a:350,h:2},
    {d:1,t:'out',n:'ค่าอาหาร',a:180,h:0},
    {d:3,t:'in',n:'ช่วยงานกิจกรรมคณะ',a:400,h:4},
    {d:4,t:'out',n:'ค่าเดินทาง',a:120,h:0},
    {d:5,t:'in',n:'ติวคณิต ม.ปลาย',a:500,h:2},
    {d:6,t:'in',n:'ตัดคลิปสั้น',a:450,h:3},
    {d:9,t:'in',n:'ออกแบบโปสเตอร์',a:900,h:5},
    {d:15,t:'in',n:'ทำสไลด์นำเสนอ',a:700,h:4},
    {d:20,t:'out',n:'ค่าหอพัก',a:2500,h:0}
  ],
};
const LV=['ยังไม่มี','เพิ่งเริ่ม','พอทำได้','ชำนาญ'];
const JOBS=[
  {id:1,t:'ตัดคลิปสั้นสำหรับร้านคาเฟ่',emp:'Brew Bar',skill:'ตัดคลิป',lvl:2,hrs:2,pay:600,rate:4.8,rev:42,ver:true,slot:2,note:'ส่งงานภายใน 2 ชั่วโมง'},
  {id:2,t:'ทำสไลด์นำเสนอ 10 หน้า',emp:'พี่ฝน (ปี 4 บริหาร)',skill:'ทำสไลด์',lvl:2,hrs:2,pay:350,rate:4.6,rev:19,ver:true,slot:1,note:'มีเทมเพลตให้'},
  {id:3,t:'ช่วยงานรับน้องคณะวิศวะ',emp:'ชมรมกิจกรรมคณะ',skill:'ช่วยงานกิจกรรม',lvl:1,hrs:4,pay:400,rate:4.7,rev:31,ver:true,slot:2,note:'18:00–22:00 ในมหาวิทยาลัย'},
  {id:4,t:'ออกแบบโปสเตอร์ร้านขนม',emp:'Sweet Corner',skill:'ออกแบบ',lvl:3,hrs:3,pay:700,rate:4.4,rev:12,ver:true,slot:3,note:'แก้ไขได้ 2 รอบ'},
  {id:6,t:'ทดลองงาน: ถ่ายรูปสินค้า 5 ชิ้น',emp:'Sweet Corner',skill:'ถ่ายภาพ',lvl:2,hrs:1,pay:150,rate:4.5,rev:8,ver:true,slot:1,trial:true,note:'งานทดลองสั้น ๆ สำหรับคนที่ยังไม่มีประวัติ'},
  {id:5,t:'พิมพ์เอกสารที่บ้าน รายได้สูงมาก',emp:'ไม่ระบุตัวตน',skill:'เขียนบทความ',lvl:1,hrs:1,pay:3000,rate:0,rev:0,ver:false,slot:3,note:'ต้องโอนค่ามัดจำก่อนเริ่มงาน'},
  {id:7,t:'ตัดคลิปรีวิวสินค้าลง TikTok',emp:'ShopNow',skill:'ตัดคลิป',lvl:2,hrs:2,pay:450,rate:4.5,rev:27,ver:true,slot:3,note:'คลิปแนวตั้ง 30–45 วินาที'},
  {id:8,t:'ทดลองงาน: ตัดคลิป 15 วินาที',emp:'ClipLab',skill:'ตัดคลิป',lvl:2,hrs:1,pay:120,rate:4.4,rev:16,ver:true,slot:2,trial:true,note:'งานทดลองสั้น ๆ สำหรับคนที่ยังไม่มีประวัติ'},
  {id:9,t:'ทำสไลด์สรุปรายงานกลุ่ม',emp:'น้องปี 2 คณะบัญชี',skill:'ทำสไลด์',lvl:1,hrs:2,pay:300,rate:4.4,rev:9,ver:true,slot:3,note:'8 หน้า มีเนื้อหาให้แล้ว'},
  {id:10,t:'ออกแบบโลโก้ร้านเสื้อผ้ามือสอง',emp:'Thrift Corner',skill:'ออกแบบ',lvl:3,hrs:3,pay:800,rate:4.6,rev:15,ver:true,slot:3,note:'ส่งไฟล์ PNG และ SVG'},
  {id:11,t:'ทดลองงาน: ออกแบบแบนเนอร์ Facebook',emp:'Sweet Corner',skill:'ออกแบบ',lvl:2,hrs:1,pay:150,rate:4.5,rev:8,ver:true,slot:2,trial:true,note:'งานทดลองสั้น 1 ชิ้น'},
  {id:12,t:'ถ่ายภาพกิจกรรมคณะ',emp:'ชมรมกิจกรรมคณะ',skill:'ถ่ายภาพ',lvl:2,hrs:3,pay:600,rate:4.7,rev:22,ver:true,slot:2,note:'ส่งรูปที่คัดแล้วภายใน 2 วัน'},
  {id:13,t:'ถ่ายรูปอาหารเมนูใหม่ร้านคาเฟ่',emp:'Brew Bar',skill:'ถ่ายภาพ',lvl:2,hrs:2,pay:500,rate:4.5,rev:11,ver:true,slot:1,note:'10 เมนู ร้านจัดแสงไว้ให้'},
  {id:14,t:'เขียนบทความรีวิวร้านอาหารใกล้มหาวิทยาลัย',emp:'Campus Eats Blog',skill:'เขียนบทความ',lvl:2,hrs:2,pay:400,rate:4.3,rev:14,ver:true,slot:3,note:'500 คำ พร้อมรูปประกอบ'},
  {id:15,t:'ทดลองงาน: เขียนแคปชั่นสินค้า 5 ชิ้น',emp:'Sweet Corner',skill:'เขียนบทความ',lvl:2,hrs:1,pay:100,rate:4.5,rev:8,ver:true,slot:2,trial:true,note:'งานทดลองสั้น ๆ'},
  {id:16,t:'ติวคณิตศาสตร์ ม.ต้น',emp:'ผู้ปกครองย่านมหาวิทยาลัย',skill:'ติวหนังสือ',lvl:2,hrs:2,pay:500,rate:4.9,rev:36,ver:true,slot:2,note:'สอนที่ห้องสมุด สัปดาห์ละ 1 ครั้ง'},
  {id:17,t:'ติวภาษาอังกฤษพื้นฐาน',emp:'Bright Tutor',skill:'ติวหนังสือ',lvl:3,hrs:2,pay:700,rate:4.8,rev:40,ver:true,slot:3,note:'กลุ่มเล็ก 4 คน'},
  {id:18,t:'ช่วยงานลงทะเบียนสัมมนา',emp:'คณะบริหารธุรกิจ',skill:'ช่วยงานกิจกรรม',lvl:1,hrs:3,pay:360,rate:4.6,rev:25,ver:true,slot:1,note:'ในมหาวิทยาลัย มีอาหารกลางวัน'},
  {id:19,t:'ช่วยแจกเอกสารงานปฐมนิเทศ',emp:'ฝ่ายกิจการนักศึกษา',skill:'ช่วยงานกิจกรรม',lvl:1,hrs:2,pay:250,rate:4.5,rev:33,ver:true,slot:0,note:'เช้าตรู่ในมหาวิทยาลัย'},
  {id:20,t:'โพสต์ไลค์ แชร์ รายได้เดือนละ 30,000',emp:'ไม่ระบุตัวตน',skill:'เขียนบทความ',lvl:1,hrs:1,pay:1500,rate:0,rev:0,ver:false,slot:3,note:'ขอสำเนาบัตรประชาชนก่อนเริ่มงาน'}
];
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
function E(sk){return state.evid[sk]||(state.evid[sk]={quiz:null,task:null,peers:[],emp:[]})}
function stage(sk){const e=E(sk),s1=e.quiz!=null&&e.quiz>=100,s2=s1&&e.task!=null&&e.task>=4,s3=s2&&e.emp.length>0&&avg(e.emp)>=4;return{s:[s1,s2,s3],lv:s1?(s2?(s3?3:2):1):0}}
function eff(sk){return stage(sk).lv}
function nextStep(sk){const s=stage(sk).s;return !s[0]?{m:'quiz',t:'ทำแบบทดสอบ'}:!s[1]?{m:'task',t:'ส่งงานลองทำ'}:!s[2]?{m:'emp',t:'หางานจริงเพื่อรับรีวิว'}:null}
function freeHours(d){return state.busy[d].reduce((s,b,i)=>s+(b?0:SLOT_H[i]),0)}
function match(j){
  const fh=freeHours(state.day),free=!state.busy[state.day][j.slot]&&fh>=j.hrs;
  const lv=eff(j.skill),ok=lv>=j.lvl,can=free&&(ok||j.trial);
  return {free,ok,can,lv,fh,score:(free?4:0)+(ok?2:0)+(j.trial&&!lv?1:0)+(j.ver?1:0)-(state.avoid.has(j.skill)?3:0)};
}
function toast(m){const t=document.getElementById('toast');t.textContent=tr(m);t.className='show';clearTimeout(toast.k);toast.k=setTimeout(()=>t.className='',1800)}
function totals(){
  const rng={day:1,week:7,month:31}[state.period];
  const rows=state.income.filter(e=>e.d<rng);
  const inc=rows.filter(e=>e.t==='in'),out=rows.filter(e=>e.t==='out');
  return {rows,inc:inc.reduce((s,e)=>s+e.a,0),out:out.reduce((s,e)=>s+e.a,0),h:inc.reduce((s,e)=>s+e.h,0)};
}
function monthIncome(){return state.income.filter(e=>e.t==='in'&&e.d<31).reduce((s,e)=>s+e.a,0)}
function netAll(){return state.income.reduce((s,e)=>s+(e.t==='in'?e.a:-e.a),0)}

function viewJobs(){
  const fh=freeHours(state.day);
  const list=JOBS.filter(j=>!state.hidden.has(j.id)).map(j=>({j,m:match(j)})).sort((a,b)=>b.m.score-a.m.score);
  const need=Math.max(0,state.goal-monthIncome());
  return `
  <div class="hero"><small>วันนี้คุณว่าง</small><div class="big">${fh} ชั่วโมง</div>
    <small>เป้าหมายเดือนนี้ ${fmt(state.goal)} บาท · ต้องหาเพิ่มอีก ${fmt(need)} บาท</small></div>
  <div class="chips" role="group" aria-label="เลือกวัน">${DAYS.map((d,i)=>`<button class="chip ${i===state.day?'on':''}" data-day="${i}">${d}</button>`).join('')}</div>
  <h2>งานที่เหมาะกับเวลาว่างของคุณ</h2>
  ${list.map(({j,m})=>{
    const o=state.open;
    const why=[

  if(e.target.id==='addForm'){state.income.unshift({d:0,t:f.t,n:f.n,a:+f.a,h:+(f.h||0)});toast('บันทึกรายการแล้ว')}
  if(e.target.id==='rateForm'){const j=JOBS.find(x=>x.id==f.jid);state.rated.add(j.id);state.open=null;const ev=+f.e;E(j.skill).emp.push(ev);
    toast('บันทึกคะแนนแล้ว ระดับ '+j.skill+' ตอนนี้: '+LV[eff(j.skill)])}
  if(e.target.id==='taskForm'){const k=state.askill;if(!stage(k).s[0]){toast('ผ่านแบบทดสอบก่อน แล้วค่อยส่งงานลองทำ')}else{const v=+f.v,x=E(k);x.task=Math.max(x.task||0,v);x.link=f.l;if(v>=4){toast('ผ่านแล้ว! ระดับ '+k+' เป็น'+LV[eff(k)]);state.assessOpen=false}else toast('ได้ '+v+'/5 ต้อง 4 ขึ้นไป ส่งใหม่ได้')}}
  if(e.target.id==='peerForm'){const x=E(state.askill);x.peers=x.peers.filter(q=>q.n!==f.n);x.peers.push({n:f.n,v:+f.v});
    toast('บันทึกความเห็นเพื่อนแล้ว')}
  if(e.target.id==='portForm'){state.portfolio.push({s:f.s,t:f.t});toast('เพิ่มผลงานแล้ว')}
  render();
});
render();
</script>
</body>
</html>
