<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daywork</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#14171f;--mute:#7b8190;--line:#ececf2;--pri:#3b5bfd;--pri-soft:#f1f3ff;--ok:#12803f;--ok-soft:#e8f7ee;--warn:#a85a00;--warn-soft:#fff5e5;--bad:#c2312b;--bad-soft:#fdeceb;--field:#fafbff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;font-size:15px;line-height:1.5}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:16px 14px 92px}
h1,h2,h3,p{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.logo{font-weight:700;font-size:22px;letter-spacing:.14em;color:var(--pri)}
.bal{font:inherit;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:13px;color:var(--mute)}
.hero{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 6px 24px rgba(30,40,90,.07);border-radius:24px;padding:22px 18px;margin-bottom:14px;text-align:center}
.hero .big{font-size:38px;font-weight:700;line-height:1.2}
.hero small{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);box-shadow:0 2px 10px rgba(30,40,90,.04);border-radius:18px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri);font-weight:500}
.tag{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:500}
.t-ok{background:var(--ok-soft);color:var(--ok)}.t-warn{background:var(--warn-soft);color:var(--warn)}.t-pri{background:var(--pri-soft);color:var(--pri)}.t-bad{background:var(--bad-soft);color:var(--bad)}
.btn{background:var(--pri);color:#fff;border:1px solid var(--pri);border-radius:999px;padding:8px 16px;font:inherit;font-weight:500;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--pri);border:1px solid var(--pri)}
.btn.sm{padding:4px 12px;font-size:13px}
.btn:focus-visible,.chip:focus-visible,.nav button:focus-visible,.cell:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.mute{color:var(--mute);font-size:13px}
.pay{font-weight:700;color:var(--ok)}
h2{font-size:17px;margin:6px 0 8px}
.job h3{font-size:16px}
.job .meta{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.sched{display:grid;grid-template-columns:44px repeat(4,1fr);gap:5px;font-size:12px;text-align:center}
.cell{border:2px solid var(--ok);border-radius:10px;padding:7px 0;font:inherit;font-size:11px;cursor:pointer;background:var(--ok-soft);color:var(--ok);display:flex;flex-direction:column;align-items:center;gap:2px}
.cell.busy{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.sched .h{color:var(--mute);align-self:center}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mute);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--pri);border-radius:6px 6px 0 0;min-height:3px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats .card{margin:0}
.stats b{font-size:20px;display:block}
.prog{height:10px;background:var(--pri-soft);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--ok)}
input,select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
form.add{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form.add .full{grid-column:1/-1}
.item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{display:flex;width:100%;max-width:480px}
.nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:12px;padding:10px 0 8px;cursor:pointer}
.nav button.on{color:var(--pri);font-weight:700}
.nav svg{display:block;margin:0 auto 2px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.why{background:var(--pri-soft);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:13px}.why ul{margin:4px 0 0;padding-left:18px;color:var(--mute)}.panel{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}:root[data-theme="dark"]{--bg:#0e1322;--card:#161c30;--ink:#eef1fb;--mute:#9aa3bd;--line:#273050;--ok:#4cd08a;--ok-soft:#12331f;--warn:#ffb55c;--warn-soft:#3a2a10;--bad:#ff8a84;--bad-soft:#3d1a19;--field:#1b2340}
.bal:focus-visible,.sw:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
:root[data-cb="1"]{--ok:#00588f;--ok-soft:#dbeeff;--bad:#a63d00;--bad-soft:#ffe9d9;--warn:#6b5500;--warn-soft:#fff3bf}
:root[data-theme="dark"][data-cb="1"]{--ok:#56b4e9;--ok-soft:#10304a;--bad:#ffa45c;--bad-soft:#4a2410;--warn:#f0e442;--warn-soft:#3d3a0c}
:root[data-cb="1"] .t-ok::before{content:"✓ "}:root[data-cb="1"] .t-bad::before{content:"✕ "}:root[data-cb="1"] .t-warn::before{content:"! "}
.themebtn{width:46px;height:46px;border-radius:50%;background:var(--pri);color:#fff;border:0;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(20,30,80,.28);position:relative;flex:none}
.themebtn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.themebtn.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--pri);animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.themebtn.pulse::after{animation:none}}
.hint{background:var(--pri-soft);border:1px solid var(--pri);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.steps{display:flex;gap:8px;margin:10px 0}.stp{flex:1;text-align:center;font-size:12px;color:var(--mute);border-top:4px solid var(--line);padding-top:6px}.stp span{display:block;font-size:16px;font-weight:700}.stp.done{border-color:var(--ok);color:var(--ok);font-weight:500}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
.hero2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.hero2>div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.hero2 b{font-size:17px}
.hero2>div:nth-child(2){background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.kv{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0;align-items:center}
.kv.big{font-size:17px;font-weight:700}
.ibtn{border:1px solid var(--line);background:var(--card);color:var(--mute);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.ibtn.on{color:var(--bad);border-color:var(--bad)}
.ibtn:focus-visible,.btn:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.okc{color:var(--ok)}.badc{color:var(--bad)}
.acts{gap:8px;flex-wrap:nowrap;margin-top:8px}
.acts .grow{flex:1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.pi{display:flex;gap:10px;align-items:center;background:var(--pri-soft);border-radius:14px;padding:10px}
.pi b{display:block;font-size:18px}
.lab{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-top:8px;color:var(--mute)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats3 .card{margin:0;text-align:center;padding:10px 4px}
.stats3 b{display:block;font-size:17px}
.eic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.eic.in{background:var(--ok-soft);color:var(--ok)}.eic.out{background:var(--bad-soft);color:var(--bad)}
.item .grow{flex:1}
.item{align-items:center}
details.why{margin:6px 0;font-size:13px}details.why summary{cursor:pointer;color:var(--mute)}details.why ul{margin:6px 0 0;padding-left:18px;color:var(--mute)}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function E(sk){return state.evid[sk]||(state.evid[sk]={quiz:null,task:null,peers:[],emp:[]})}
function stage(sk){const e=E(sk),s1=e.quiz!=null&&e.quiz>=100,s2=s1&&e.task!=null&&e.task>=4,s3=s2&&e.emp.length>0&&avg(e.emp)>=4;return{s:[s1,s2,s3],lv:s1?(s2?(s3?3:2):1):0}}
function eff(sk){return stage(sk).lv}
function nextStep(sk){const s=stage(sk).s;return !s[0]?{m:'quiz',t:'ทำแบบทดสอบ'}:!s[1]?{m:'task',t:'ส่งงานลองทำ'}:!s[2]?{m:'emp',t:'หางานจริงเพื่อรับรีวิว'}:null}
function freeHours(d){return state.busy[d].reduce((s,b,i)=>s+(b?0:SLOT_H[i]),0)}
function match(j){
  const fh=freeHours(state.day),free=!state.busy[state.day][j.slot]&&fh>=j.hrs;

  return {free,ok,can,lv,fh,score:(free?4:0)+(ok?2:0)+(j.trial&&!lv?1:0)+(j.ver?1:0)-(state.avoid.has(j.skill)?3:0)};
}

function plan(){
  const fh=freeHours(state.day);let rem=fh,est=0;const used=new Set(),pick=[];
  JOBS.filter(j=>!state.hidden.has(j.id)).map(j=>({j,m:match(j)})).filter(x=>x.m.can).sort((a,b)=>b.j.pay/b.j.hrs-a.j.pay/a.j.hrs).forEach(({j})=>{
    if(j.hrs<=rem&&!used.has(j.slot)){rem-=j.hrs;used.add(j.slot);est+=j.pay;pick.push(j)}});
  return {fh,est,pick};
}

  const dark=theme.mode==='dark'||(theme.mode==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  const r=document.documentElement,a=theme.cb?ACC['น้ำเงิน']:(ACC[theme.accent]||ACC['น้ำเงิน']);
  r.setAttribute('data-cb',theme.cb?'1':'0');r.style.zoom=theme.zoom;
  r.setAttribute('data-theme',dark?'dark':'light');
  r.style.setProperty('--pri',dark?a[2]:a[0]);r.style.setProperty('--pri-soft',dark?a[3]:a[1]);
  try{localStorage.setItem('dwtheme',JSON.stringify({mode:theme.mode,accent:theme.accent,cb:theme.cb,zoom:theme.zoom}))}catch(e){}
}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(theme.mode==='auto')applyTheme()})}catch(e){}
function hintCard(){return `<div class="hint"><b>ลองกดเล่นได้เลย</b><p class="mute">กดปุ่มจานสีวงกลมมุมขวาบน เพื่อเปลี่ยนโหมดขาว/มืด เปลี่ยนสีหลัก ใช้โหมดตาบอดสี หรือขยายตัวอักษร (Zoom) แล้วดูผลทั้งแอปทันที</p><button class="btn sm" data-themeopen="1" style="margin-top:6px">ลองเลย</button></div>`}
function themePanel(){return `<div class="card"><div class="row"><b>ธีมและการเข้าถึง</b><span><button class="btn sm ghost" data-treset="1">รีเซ็ต</button> <button class="btn sm" data-themeopen="1">ปิด</button></span></div>
  <p class="mute">โหมดสี</p><div class="chips" role="group" aria-label="โหมดสี">${[['light','ขาว'],['dark','มืด'],['auto','ตามเครื่อง']].map(([k,l])=>`<button class="chip ${theme.mode===k?'on':''}" data-tmode="${k}">${l}</button>`).join('')}</div>
  <p class="mute">สีหลัก${theme.cb?' (โหมดตาบอดสีใช้สีน้ำเงินคงที่)':''}</p><div class="chips" role="group" aria-label="สีหลัก">${Object.keys(ACC).map(k=>`<button class="sw ${theme.accent===k?'on':''}" style="background:${ACC[k][0]}" data-accent="${k}" aria-label="สี${k}" ${theme.cb?'disabled style="opacity:.4"':''}></button>`).join('')}</div>
  <p class="mute">โหมดตาบอดสี (ไม่แยกแค่แดง-เขียว ใช้สีน้ำเงิน-ส้มและเครื่องหมาย ✓ ! ✕ ช่วย)</p><div class="chips" role="group" aria-label="โหมดตาบอดสี">${[[false,'ปิดใช้งาน'],[true,'เปิดใช้งาน']].map(([k,l])=>`<button class="chip ${theme.cb===k?'on':''}" data-tcb="${k}" aria-pressed="${theme.cb===k}">${l}</button>`).join('')}</div>
  <p class="mute">ขนาดตัวอักษรและหน้าจอ (Zoom)</p><div class="chips" role="group" aria-label="ขนาด">${[[1,'ปกติ'],[1.25,'ใหญ่'],[1.5,'ใหญ่มาก']].map(([k,l])=>`<button class="chip ${theme.zoom===k?'on':''}" data-tzoom="${k}" aria-pressed="${theme.zoom===k}">${l}</button>`).join('')}</div></div>`}
function render(){
  applyTheme();document.getElementById('themeSlot').innerHTML=theme.open?themePanel():(theme.seen?'':hintCard());
  const v={jobs:viewJobs,schedule:viewSchedule,assess:viewAssess,money:viewMoney}[state.tab]();
  document.getElementById('main').innerHTML=v;
  document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button class="${state.tab===k?'on':''}" data-tab="${k}" ${state.tab===k?'aria-current="page"':''}>${ic(ICONS[k],22)}${l}</button>`).join('');
  document.getElementById('balTop').textContent='คงเหลือ '+fmt(netAll())+' ฿';
  localize();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.tab){state.tab=d.tab;scrollTo(0,0)}
  else if(d.go){state.tab=d.go;scrollTo(0,0)}
  else if(d.day){state.day=+d.day}
  else if(d.period){state.period=d.period}
  else if(d.cell){const[a,c]=d.cell.split(',').map(Number);state.busy[a][c]=!state.busy[a][c]}
  else if(d.apply){state.applied.add(+d.apply);toast('สมัครงานแล้ว รอผู้ว่าจ้างตอบกลับ')}
  else if(d.report){state.reported.add(+d.report);toast('ส่งรายงานให้ทีมตรวจสอบแล้ว')}
  else if(d.mmopen){state.open={t:'mm',id:+d.mmopen}}
  else if(d.rate){state.open={t:'rate',id:+d.rate}}
  else if(d.mm){const[id,r]=d.mm.split(',');const j=JOBS.find(x=>x.id==id);state.hidden.add(+id);state.open=null;
    if(r==='ยากเกินไป'){toast('รับทราบ ไปทำขั้นต่อไปในบันไดทักษะเพื่อขึ้นระดับ')}
    else if(r==='ไม่ใช่ทักษะนี้'){state.avoid.add(j.skill);toast('จะแนะนำงานแนว '+j.skill+' น้อยลง')}
    else toast('รับทราบ จะเลือกงานที่เวลาลงตัวกว่านี้')}
  else if(d.delp!==undefined){state.portfolio.splice(+d.delp,1)}
  else if(d.themeopen){theme.open=!theme.open;theme.seen=true;scrollTo(0,0)}
  else if(d.treset){theme.mode='auto';theme.accent='น้ำเงิน';theme.cb=false;theme.zoom=1}
  else if(d.tmode){theme.mode=d.tmode}
  else if(d.accent){theme.accent=d.accent}
  else if(d.tcb){theme.cb=d.tcb==='true'}
  else if(d.tzoom){theme.zoom=+d.tzoom}
  else if(d.astep){const k=d.astep,n=nextStep(k);state.askill=k;if(n.m==='emp'){state.tab='jobs';toast('สมัครงานที่ตรงระดับ จบงานแล้วกด "จบงานแล้ว ให้คะแนน"')}else{state.method=n.m;state.assessOpen=true}scrollTo(0,0)}
  else if(d.climb){state.askill=d.climb;state.tab='assess';const n=nextStep(d.climb);if(n&&n.m!=='emp'){state.method=n.m;state.assessOpen=true}scrollTo(0,0)}
  else if(d.aclose){state.assessOpen=false}
  else if(d.lang){lang=lang==='th'?'en':'th';try{localStorage.setItem('dwlang',lang)}catch(e){}}
  else if(d.repopen){state.open={t:'rep',id:+d.repopen}}
  else if(d.rep){const[id]=d.rep.split(',');state.reported.add(+id);state.open=null;toast('ส่งรายงานให้ทีมตรวจสอบแล้ว')}
  else if(d.areset){state.evid={};state.qans={};state.rated=new Set();state.assessOpen=false;toast('รีเซ็ตผลทดสอบและคะแนนทั้งหมดเป็นศูนย์แล้ว')}
  else if(d.peeropen){state.askill=d.peeropen;state.method='peer';state.assessOpen=true;scrollTo(0,0)}
  else if(d.askill){state.askill=d.askill}
  else if(d.method){state.method=d.method}
  else if(d.qa){const[i,o]=d.qa.split(',').map(Number);(state.qans[state.askill]=state.qans[state.askill]||{})[i]=o}
  else if(d.qsubmit){const sk=state.askill,a=state.qans[sk]||{};
    if(Object.keys(a).length<Q[sk].length){toast('ตอบให้ครบทุกข้อก่อนส่ง');return}
    const q=Math.round(Q[sk].filter((q,i)=>a[i]===q[4]).length/Q[sk].length*100);E(sk).quiz=Math.max(E(sk).quiz||0,q);state.qans[sk]={};
    if(q>=100){toast('ผ่านแล้ว! ระดับ '+sk+' เป็น'+LV[eff(sk)]);state.assessOpen=false}else toast('ได้ '+q+'% ต้องตอบถูกทุกข้อ ลองใหม่ได้')}
  else return;
  render();
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  if(e.target.id==='addForm'){state.income.unshift({d:0,t:f.t,n:f.n,a:+f.a,h:+(f.h||0)});toast('บันทึกรายการแล้ว')}
  if(e.target.id==='rateForm'){const j=JOBS.find(x=>x.id==f.jid);state.rated.add(j.id);state.open=null;const ev=+f.e;E(j.skill).emp.push(ev);
    state.income.unshift({d:0,t:'in',n:j.t,a:j.pay,h:j.hrs});toast('บันทึกคะแนนแล้ว ระดับ '+j.skill+' ตอนนี้: '+LV[eff(j.skill)]+' · เพิ่มรายได้ '+fmt(j.pay)+' ฿')}
  if(e.target.id==='planForm'){state.budget=+f.b;state.goal=+f.g;toast('บันทึกงบและเป้าหมายแล้ว')}
  if(e.target.id==='taskForm'){const k=state.askill;if(!stage(k).s[0]){toast('ผ่านแบบทดสอบก่อน แล้วค่อยส่งงานลองทำ')}else{const v=+f.v,x=E(k);x.task=Math.max(x.task||0,v);x.link=f.l;if(v>=4){toast('ผ่านแล้ว! ระดับ '+k+' เป็น'+LV[eff(k)]);state.assessOpen=false}else toast('ได้ '+v+'/5 ต้อง 4 ขึ้นไป ส่งใหม่ได้')}}
  if(e.target.id==='peerForm'){const x=E(state.askill);x.peers=x.peers.filter(q=>q.n!==f.n);x.peers.push({n:f.n,v:+f.v});
    toast('บันทึกความเห็นเพื่อนแล้ว')}
  if(e.target.id==='portForm'){state.portfolio.push({s:f.s,t:f.t});toast('เพิ่มผลงานแล้ว')}
  render();
});
render();
</script>
